<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#10191f">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; worker-src 'self'; connect-src 'self' https://fbebytnhlanqdbbvxzwz.supabase.co wss://fbebytnhlanqdbbvxzwz.supabase.co; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; object-src 'none'; base-uri 'none'">
  <title>Dorra | Strategic Command</title>
  <link rel="stylesheet" href="war-simulation.css">
  <link rel="stylesheet" href="war/experience.css">
  <link rel="stylesheet" href="online-shell.css">
</head>
<body class="war-page">
  <script type="module" src="online-shell.js"></script>
  <div id="warApp" class="war-app" aria-busy="true">
    <header class="command-header">
      <a class="command-brand" href="index.html" aria-label="Return to Dorra House"><span class="brand-mark" aria-hidden="true">D<span>•</span></span><span>DORRA<small>STRATEGIC COMMAND</small></span></a>
      <div class="command-context"><span class="live-dot"></span><span id="commandContext">OPERATIONS CENTRE</span></div>
      <div id="resourceBar" class="resource-bar" aria-label="National resources"></div>
      <div id="goldBalance" class="gold-balance" aria-live="polite"></div>
      <button class="icon-button" id="helpButton" aria-label="Command guide" title="Command guide">?</button>
      <a class="house-link" href="index.html">House <span aria-hidden="true">↗</span></a>
    </header>
    <main class="war-workspace">
      <section class="world-map" aria-label="World command map">
        <canvas id="worldCanvas" tabindex="0" role="application" aria-label="Interactive world map. Drag to pan, scroll or pinch to zoom. Select a nation or province. Shift drag selects units. Keyboard plus and minus zoom, H returns home."></canvas>
        <div class="map-grain" aria-hidden="true"></div>
        <div id="mapLoading" class="map-loading"><span class="spinner"></span> Preparing world map</div>
        <div class="map-coordinates" id="mapCoordinates" aria-hidden="true">GLOBAL THEATRE / 180° W — 180° E</div>
        <div class="map-controls"><button id="mapZoomIn" aria-label="Zoom in">+</button><button id="mapZoomOut" aria-label="Zoom out">−</button><button id="mapHome" aria-label="Show whole world" title="Whole world (H)">⌖</button></div>
        <div class="map-legend"><i class="friendly"></i> YOUR NATION <i class="hostile"></i> HOSTILE <i class="neutral"></i> NEUTRAL</div>
        <div id="mapTooltip" class="map-tooltip" hidden></div>
      </section>
      <section id="bootPanel" class="boot-panel" role="status"><span class="eyebrow">SECURE UPLINK</span><h1>Take command.</h1><p>Connecting your account to the operations centre.</p><span class="spinner"></span></section>
      <section id="lobbyPanel" class="lobby-panel" aria-labelledby="lobbyTitle" hidden></section>
      <nav id="commandNav" class="command-nav" aria-label="Command sections" hidden></nav>
      <section id="commandDrawer" class="command-drawer" aria-label="Command details" hidden></section>
      <div id="matchClock" class="match-clock" hidden></div>
      <section id="selectionPanel" class="selection-panel" aria-label="Selected forces" hidden></section>
      <div id="connectionBanner" class="connection-banner" role="alert" hidden><span></span><button id="retryConnection">Reconnect</button></div>
    </main>
    <div id="toast" class="war-toast" role="status" aria-live="polite"></div>
    <dialog id="commandDialog" class="command-dialog" aria-labelledby="dialogTitle"><div id="dialogBody"></div></dialog>
  </div>
  <script type="module" src="war-simulation.js"></script>
</body>
</html>
